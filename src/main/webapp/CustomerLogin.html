 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* =========================
           LOGIN CONTAINER
        ========================= */

        .login-container {
            width: 100%;
            max-width: 420px;
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {
            background: #ffffff;

            padding: 40px;

            border-radius: 16px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);

            border: 1px solid #e2e8f0;
        }


        /* =========================
           ICON
        ========================= */

        .login-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #dbeafe;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }


        /* =========================
           HEADER
        ========================= */

        .login-header {
            text-align: center;

            margin-bottom: 30px;
        }


        .login-header h1 {
            font-size: 27px;

            color: #1e293b;

            margin-bottom: 8px;
        }


        .login-header p {
            font-size: 14px;

            color: #64748b;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================
           INPUT
        ========================= */

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            color: #1e293b;

            background: #ffffff;

            transition: 0.3s;
        }


        .form-group input:focus {
            border-color: #2563eb;

            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        .form-group input::placeholder {
            color: #94a3b8;
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .error-message {
            display: none;

            margin-top: 6px;

            color: #dc2626;

            font-size: 12px;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {
            width: 100%;

            padding: 13px;

            margin-top: 5px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }


        .login-btn:hover {
            background: #1d4ed8;

            transform: translateY(-2px);

            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25);
        }


        /* =========================
           REGISTER SECTION
        ========================= */

        .register-section {
            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;
        }


        .register-section p {
            color: #64748b;

            font-size: 14px;

            margin-bottom: 8px;
        }


        .register-link {
            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }


        .register-link:hover {
            text-decoration: underline;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            font-size: 12px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 480px) {

            .login-card {
                padding: 30px 22px;
            }


            .login-header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <!-- Login Icon -->

            <div class="login-icon">
                👤
            </div>


            <!-- Header -->

            <div class="login-header">

                <h1>
                    Customer Login
                </h1>

                <p>
                    Login to access your account
                </p>

            </div>


            <!-- =========================
                 LOGIN FORM
            ========================= -->

            <!-- Existing action and method unchanged -->

            <form
                action="clog"
                method="post"
                onsubmit="return validateLogin();">


                <!-- Username -->

                <div class="form-group">

                    <label for="uname">
                        Username
                    </label>

                    <input
                        type="text"
                        id="uname"
                        name="uname"
                        placeholder="Enter your username"
                        autocomplete="username"
                        oninput="clearUsernameError();">

                    <div
                        id="usernameError"
                        class="error-message">

                        Please enter your username.

                    </div>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="upwd">
                        Password
                    </label>

                    <input
                        type="password"
                        id="upwd"
                        name="upwd"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        oninput="clearPasswordError();">

                    <div
                        id="passwordError"
                        class="error-message">

                        Please enter your password.

                    </div>

                </div>


                <!-- Login Button -->

                <input
                    type="submit"
                    value="Login"
                    class="login-btn">


            </form>


            <!-- =========================
                 REGISTER
            ========================= -->

            <div class="register-section">

                <p>
                    Don't have an account?
                </p>

                <!-- Existing URL unchanged -->

                <a
                    href="CustomerRegister.html"
                    class="register-link">

                    Create a New Account

                </a>

            </div>


        </div>


        <div class="footer">

            Customer Management System

        </div>


    </div>



    <!-- =========================
         JAVASCRIPT VALIDATION
    ========================= -->

    <script>

        function validateLogin() {

            var username =
                document.getElementById("uname").value.trim();

            var password =
                document.getElementById("upwd").value.trim();

            var usernameError =
                document.getElementById("usernameError");

            var passwordError =
                document.getElementById("passwordError");

            var valid = true;


            /* Hide previous errors */

            usernameError.style.display = "none";
            passwordError.style.display = "none";


            /* Username validation */

            if (username === "") {

                usernameError.style.display = "block";

                valid = false;

            }


            /* Password validation */

            if (password === "") {

                passwordError.style.display = "block";

                valid = false;

            }


            return valid;

        }


        function clearUsernameError() {

            document.getElementById("usernameError")
                .style.display = "none";

        }


        function clearPasswordError() {

            document.getElementById("passwordError")
                .style.display = "none";

        }

    </script>


</body>

</html>
