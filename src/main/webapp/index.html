<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome | Management System</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg-color);
        color: var(--text-color);
        transition: 0.3s ease;
    }

    /* Light Theme */
    :root {
        --bg-color: linear-gradient(135deg, #eef2ff, #dbeafe);
        --card-color: #ffffff;
        --inner-card: #f8fafc;
        --text-color: #1e293b;
        --secondary-text: #64748b;
        --border-color: #e2e8f0;
        --shadow: rgba(0, 0, 0, 0.12);
    }

    /* Dark Theme */
    body.dark-mode {
        --bg-color: linear-gradient(135deg, #0f172a, #1e293b);
        --card-color: #1e293b;
        --inner-card: #334155;
        --text-color: #f8fafc;
        --secondary-text: #cbd5e1;
        --border-color: #475569;
        --shadow: rgba(0, 0, 0, 0.4);
    }

    .container {
        position: relative;
        width: 90%;
        max-width: 850px;
        background: var(--card-color);
        padding: 50px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 15px 40px var(--shadow);
        transition: 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
    }

    .theme-toggle button {
        border: none;
        background: var(--inner-card);
        color: var(--text-color);
        padding: 10px 16px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.3s;
    }

    .theme-toggle button:hover {
        transform: scale(1.05);
    }

    .container h1 {
        color: var(--text-color);
        font-size: 32px;
        margin-bottom: 10px;
    }

    .subtitle {
        color: var(--secondary-text);
        font-size: 16px;
        margin-bottom: 40px;
    }

    .login-options {
        display: flex;
        justify-content: center;
        gap: 25px;
    }

    .login-card {
        width: 280px;
        padding: 30px 25px;
        border: 1px solid var(--border-color);
        border-radius: 15px;
        transition: 0.3s ease;
        background: var(--inner-card);
    }

    .login-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 25px var(--shadow);
    }

    .icon {
        font-size: 45px;
        margin-bottom: 15px;
    }

    .login-card h2 {
        color: var(--text-color);
        margin-bottom: 10px;
    }

    .login-card p {
        color: var(--secondary-text);
        font-size: 14px;
        margin-bottom: 25px;
    }

    .btn {
        display: inline-block;
        width: 100%;
        padding: 12px;
        text-decoration: none;
        color: white;
        background: #2563eb;
        border-radius: 8px;
        font-weight: 600;
        transition: 0.3s;
    }

    .btn:hover {
        background: #1d4ed8;
    }

    .customer-btn {
        background: #059669;
    }

    .customer-btn:hover {
        background: #047857;
    }

    .footer {
        margin-top: 35px;
        color: var(--secondary-text);
        font-size: 13px;
    }

    @media (max-width: 650px) {

        .container {
            padding: 35px 20px;
        }

        .login-options {
            flex-direction: column;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 350px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button onclick="toggleTheme()" id="themeButton">
            🌙 Dark Mode
        </button>
    </div>

    <h1>Welcome to Management System</h1>

    <p class="subtitle">
        Please select your login type to continue
    </p>

    <div class="login-options">

        <!-- Admin Login -->
        <div class="login-card">
            <div class="icon">👨‍💼</div>

            <h2>Admin</h2>

            <p>
                Access the admin panel to manage
                the system and its operations.
            </p>

            <!-- URL NOT CHANGED -->
            <a href="AdminLogin.html" class="btn">
                Admin Login
            </a>
        </div>

        <!-- Customer Login -->
        <div class="login-card">
            <div class="icon">👤</div>

            <h2>Customer</h2>

            <p>
                Login to your account and access
                customer services.
            </p>

            <!-- URL NOT CHANGED -->
            <a href="CustomerLogin.html" class="btn customer-btn">
                Customer Login
            </a>
        </div>

    </div>

    <div class="footer">
        © 2026 Management System. All Rights Reserved.
    </div>

</div>

<script>

    function toggleTheme() {

        document.body.classList.toggle("dark-mode");

        let button = document.getElementById("themeButton");

        if (document.body.classList.contains("dark-mode")) {
            button.innerHTML = "☀️ Light Mode";
        } else {
            button.innerHTML = "🌙 Dark Mode";
        }
    }

</script>

</body>
</html>
